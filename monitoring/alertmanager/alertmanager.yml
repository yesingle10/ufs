# =============================================================================
# Alertmanager 配置 — UFS Core 告警路由
# =============================================================================

global:
  resolve_timeout: 5m

# ----------------------------------------------------------------------------
# 路由规则
# ----------------------------------------------------------------------------
route:
  receiver: 'default'
  group_by: ['alertname', 'application']
  group_wait: 30s          # 首次告警等待时间（聚合）
  group_interval: 5m       # 同组告警发送间隔
  repeat_interval: 4h      # 重复告警间隔
  routes:
    # 严重告警 — 立即发送
    - matchers:
        - severity = critical
      receiver: 'default'
      group_wait: 10s
      repeat_interval: 1h
    # 警告级别
    - matchers:
        - severity = warning
      receiver: 'default'
      group_wait: 30s
      repeat_interval: 4h

# ----------------------------------------------------------------------------
# 接收器
# ----------------------------------------------------------------------------
receivers:
  - name: 'default'
    # 当前仅控制台输出，后续可配置 webhook / 邮件 / 钉钉等
    # webhook_configs:
    #   - url: 'http://your-webhook:5000/alert'
    #     send_resolved: true
    # email_configs:
    #   - to: 'ops@example.com'
    #     from: 'alertmanager@example.com'
    #     smarthost: 'smtp.example.com:587'
    #     auth_username: 'alertmanager@example.com'
    #     auth_password: 'password'

# ----------------------------------------------------------------------------
# 抑制规则 — 当 critical 告警触发时抑制 warning
# ----------------------------------------------------------------------------
inhibit_rules:
  - source_matchers:
      - severity = critical
    target_matchers:
      - severity = warning
    equal: ['alertname', 'application']
