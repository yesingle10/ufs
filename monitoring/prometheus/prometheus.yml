# =============================================================================
# Prometheus 配置 — UFS Core 监控
# =============================================================================

global:
  scrape_interval: 15s          # 抓取间隔
  evaluation_interval: 15s      # 规则评估间隔
  scrape_timeout: 10s           # 单次抓取超时

# ----------------------------------------------------------------------------
# 告警规则文件（可选，后续可启用）
# ----------------------------------------------------------------------------
# rule_files:
#   - /etc/prometheus/rules/*.yml

# ----------------------------------------------------------------------------
# Alertmanager 配置（可选，后续可启用）
# ----------------------------------------------------------------------------
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ----------------------------------------------------------------------------
# 抓取配置
# ----------------------------------------------------------------------------
scrape_configs:
  # Prometheus 自身指标
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # UFS Core 应用指标（Spring Boot Actuator）
  - job_name: 'ufs-core'
    metrics_path: '/actuator/prometheus'
    scrape_interval: 15s
    static_configs:
      - targets: ['ufs-core:8080']
        labels:
          application: 'ufs-core'
          env: 'docker'

# ----------------------------------------------------------------------------
# Recording Rules — 预计算常用指标，减少查询负载
# ----------------------------------------------------------------------------
# rule_files:
#   - /etc/prometheus/recording_rules.yml
