apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ufs.configmapName" . }}
  labels:
    {{- include "ufs.labels" . | nindent 4 }}
data:
  SERVER_PORT: {{ .Values.config.serverPort | quote }}
  {{- range $key, $val := .Values.config.extraEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
