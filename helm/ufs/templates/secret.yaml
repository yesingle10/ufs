apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ufs.secretName" . }}
  labels:
    {{- include "ufs.labels" . | nindent 4 }}
type: Opaque
stringData:
  # JWT
  jwt-secret: {{ .Values.secrets.jwtSecret | quote }}

  # MySQL
  {{- if .Values.mysql.enabled }}
  mysql-root-password: {{ .Values.mysql.rootPassword | quote }}
  mysql-password: {{ .Values.mysql.password | quote }}
  {{- end }}

  # Redis
  {{- if .Values.redis.enabled }}
  redis-password: {{ .Values.redis.password | quote }}
  {{- end }}

  # Cloud storage — COS (Tencent)
  cos-secret-id: {{ .Values.secrets.cos.secretId | quote }}
  cos-secret-key: {{ .Values.secrets.cos.secretKey | quote }}

  # Cloud storage — OSS (Alibaba)
  oss-access-key-id: {{ .Values.secrets.oss.accessKeyId | quote }}
  oss-access-key-secret: {{ .Values.secrets.oss.accessKeySecret | quote }}

  # Cloud storage — KODO (Qiniu)
  kodo-access-key: {{ .Values.secrets.kodo.accessKey | quote }}
  kodo-secret-key: {{ .Values.secrets.kodo.secretKey | quote }}

  # Cloud storage — TOS (ByteDance)
  tos-access-key-id: {{ .Values.secrets.tos.accessKeyId | quote }}
  tos-access-key-secret: {{ .Values.secrets.tos.accessKeySecret | quote }}
