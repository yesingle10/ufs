spring:
  datasource:
    url: jdbc:h2:mem:ufs_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  flyway:
    locations: classpath:db/migration-h2
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  h2:
    console:
      enabled: true
      path: /h2-console

# dev-local 不需要 RocketMQ 连接（审计走 LoggingAuditPublisher）
ufs:
  jwt-secret: dev-only-change-me-please-32bytes-min!!
  jwt-ttl-seconds: 7200
  sign-ttl-seconds: 300
  nonce-ttl-seconds: 300
  app-credentials:
    app_demo:
      tenant-id: t_demo
      app-secret: secret_demo

logging:
  level:
    com.ufs.core: DEBUG
    org.springframework.web: DEBUG
