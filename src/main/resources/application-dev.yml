# =============================================================================
# dev profile — 本地开发环境
# 激活: spring.profiles.active=dev
# =============================================================================
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/ufs_dev?useUnicode=true&characterEncoding=utf8mb4&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  flyway:
    clean-disabled: false

logging:
  level:
    com.ufs.core: DEBUG
    com.ufs.core.repository: DEBUG
    org.springframework.web: DEBUG
    org.flywaydb: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"
