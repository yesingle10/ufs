# =============================================================================
# UFS Core 容器编排 — MySQL 8 + Redis 7 + ufs-core
#
# 启动: docker compose up -d
# 停止: docker compose down
# 清理: docker compose down -v  （会删除数据卷）
# =============================================================================

services:
  mysql:
    image: mysql:8.0
    container_name: ufs-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ufs}
      MYSQL_USER: ${MYSQL_USER:-ufs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ufs_pass}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ufs", "-p${MYSQL_PASSWORD:-ufs_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - ufs-net

  redis:
    image: redis:7-alpine
    container_name: ufs-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ufs-net

  ufs-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: ufs-core:${UFS_VERSION:-latest}
    container_name: ufs-core
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ufs}
      MYSQL_USER: ${MYSQL_USER:-ufs}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ufs_pass}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      UFS_JWT_SECRET: ${UFS_JWT_SECRET:-prod-jwt-secret-change-me-32bytes}
      UFS_DB_PASSWORD: ${MYSQL_PASSWORD:-ufs_pass}
      # 云存储密钥（可选 — 不配则使用本地存储）
      UFS_COS_SECRET_ID: ${UFS_COS_SECRET_ID:-}
      UFS_COS_SECRET_KEY: ${UFS_COS_SECRET_KEY:-}
      UFS_COS_REGION: ${UFS_COS_REGION:-}
      UFS_COS_DEFAULT_BUCKET: ${UFS_COS_DEFAULT_BUCKET:-}
      UFS_OSS_ACCESS_KEY_ID: ${UFS_OSS_ACCESS_KEY_ID:-}
      UFS_OSS_ACCESS_KEY_SECRET: ${UFS_OSS_ACCESS_KEY_SECRET:-}
      UFS_OSS_ENDPOINT: ${UFS_OSS_ENDPOINT:-}
      UFS_OSS_DEFAULT_BUCKET: ${UFS_OSS_DEFAULT_BUCKET:-}
      UFS_KODO_ACCESS_KEY: ${UFS_KODO_ACCESS_KEY:-}
      UFS_KODO_SECRET_KEY: ${UFS_KODO_SECRET_KEY:-}
      UFS_KODO_DEFAULT_BUCKET: ${UFS_KODO_DEFAULT_BUCKET:-}
      UFS_TOS_ACCESS_KEY_ID: ${UFS_TOS_ACCESS_KEY_ID:-}
      UFS_TOS_ACCESS_KEY_SECRET: ${UFS_TOS_ACCESS_KEY_SECRET:-}
      UFS_TOS_ENDPOINT: ${UFS_TOS_ENDPOINT:-}
      UFS_TOS_REGION: ${UFS_TOS_REGION:-}
      UFS_TOS_DEFAULT_BUCKET: ${UFS_TOS_DEFAULT_BUCKET:-}
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - ufs-net

  # ===========================================================================
  # 监控栈 — Prometheus + Grafana + Alertmanager
  # ===========================================================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ufs-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - ufs-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: ufs-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    networks:
      - ufs-net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: ufs-alertmanager
    restart: unless-stopped
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    networks:
      - ufs-net

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  ufs-net:
    driver: bridge
